<title>SCRATCH</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: single-column mobile-first stack — topbar, ticket card (tabs + prize strip + scratch grid), bet card.
   Deliberate single dark "casino table" world — no light variant. */
:root{
  color-scheme: dark;
  --bg:#0f212e;
  --panel:#1a2c38;
  --panel-2:#213743;
  --border:#2f4759;
  --text:#e7eef5;
  --text-dim:#8497a8;
  --accent-blue:#1475e1;
  --accent-blue-hi:#2f8bff;
  --accent-purple:#8c5cf5;
  --accent-green:#00e701;
  --font-display:'Space Grotesk', 'Segoe UI', sans-serif;
  --font-body:'Inter', 'Segoe UI', sans-serif;
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  margin:0;
}

.app{
  max-width:520px;
  margin:0 auto;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px 40px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* ---------- topbar ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  font-family:var(--font-display);
  font-weight:700;
  font-size:19px;
  letter-spacing:.2px;
  display:flex;
  align-items:center;
  gap:9px;
}
.brand-dot{
  width:20px;height:20px;border-radius:6px;
  background:linear-gradient(135deg,#eafcff,#7fd8ff);
  box-shadow:0 0 10px rgba(127,216,255,.6);
  flex:0 0 auto;
}
.balance-pill{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:9px 14px;
  border-radius:999px;
  font-weight:700;
  font-variant-numeric:tabular-nums;
  font-size:14px;
}
.balance-coin{
  width:14px;height:14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffe9a8, #e8a93b 70%);
  flex:0 0 auto;
}

/* ---------- shared panel ---------- */
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px;
}
.panel-title{
  font-family:var(--font-display);
  font-weight:600;
  font-size:13px;
  letter-spacing:.4px;
  text-transform:uppercase;
  color:var(--text-dim);
  margin:0 0 10px;
}

/* ---------- difficulty tabs ---------- */
.diff-tabs{
  display:flex;
  background:var(--panel-2);
  border-radius:9px;
  padding:4px;
  gap:4px;
}
.diff-tabs.locked{opacity:.55; pointer-events:none;}
.diff-tab{
  flex:1;
  border:none;
  background:transparent;
  color:var(--text-dim);
  font-family:var(--font-body);
  font-weight:600;
  font-size:13px;
  padding:9px 0;
  border-radius:6px;
  cursor:pointer;
  transition:background .15s ease, color .15s ease;
}
.diff-tab.active{
  background:var(--accent-purple);
  color:#fff;
}

/* ---------- prize strip ---------- */
.legend-label{
  margin-top:14px;
  margin-bottom:8px;
  font-size:11px;
  font-weight:600;
  letter-spacing:.6px;
  text-transform:uppercase;
  color:var(--text-dim);
}
.legend{
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.legend::-webkit-scrollbar{display:none;}
.legend-item{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  min-width:52px;
  padding:8px 6px;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:9px;
}
.legend-item:first-child{
  border-color:rgba(255,217,102,.6);
  box-shadow:0 0 10px rgba(232,169,59,.3) inset;
}
.legend-item .gem{width:24px;height:24px;}
.legend-mult{
  font-family:var(--font-display);
  font-weight:700;
  font-size:11.5px;
  font-variant-numeric:tabular-nums;
}

/* ---------- ticket gold frame ---------- */
.ticket-frame{
  background:linear-gradient(135deg,#ffe9a8,#e8a93b);
  border-radius:18px;
  padding:4px;
  margin-top:14px;
  box-shadow:0 10px 28px rgba(0,0,0,.35), 0 0 0 1px rgba(232,169,59,.3);
}
.ticket-frame-inner{
  background:var(--panel-2);
  border-radius:15px;
  padding:10px;
}

/* ---------- scratch grid ---------- */
.grid-wrap{
  position:relative;
}
.ticket-grid{
  display:grid;
  grid-template-columns:repeat(var(--cols), 1fr);
}
.ticket-grid[data-size="9"]{gap:4px;}
.ticket-grid[data-size="6"]{gap:7px;}
.ticket-grid[data-size="3"]{gap:11px;}

.cell{
  position:relative;
  aspect-ratio:1;
  border:none;
  padding:0;
  background:transparent;
  border-radius:6px;
  overflow:hidden;
  cursor:default;
}
.ticket-grid[data-size="3"] .cell{border-radius:14px;}
.ticket-grid[data-size="6"] .cell{border-radius:9px;}

.ticket-grid.interactive .cell:not(.revealed){cursor:pointer;}
.ticket-grid.interactive .cell:not(.revealed):active .scratch-canvas{transform:scale(.94);}

.face{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  border-radius:inherit;
}
.face.front{
  flex-direction:column;
  gap:2px;
  background:var(--panel-2);
}
.scratch-canvas{
  position:absolute;inset:0;
  width:100%;height:100%;
  display:block;
  border-radius:inherit;
  touch-action:none;
  transition:transform .12s ease;
}
.cell.revealed .scratch-canvas{pointer-events:none;}
.cell.final .face.front{opacity:.82;}

.cell .gem{width:58%;height:58%;}
.gem.tier-star{filter:drop-shadow(0 0 6px rgba(232,169,59,.75));}
.gem.tier-diamond{filter:drop-shadow(0 0 5px rgba(127,216,255,.55));}
.gem.tier-red{filter:drop-shadow(0 0 4px rgba(200,30,58,.5));}
.gem.tier-green{filter:drop-shadow(0 0 4px rgba(15,157,88,.5));}
.gem.tier-yellow{filter:drop-shadow(0 0 4px rgba(227,168,21,.5));}
.gem.tier-blue{filter:drop-shadow(0 0 4px rgba(28,111,217,.5));}
.mult-label{
  font-family:var(--font-display);
  font-weight:700;
  font-variant-numeric:tabular-nums;
  line-height:1;
}
.ticket-grid[data-size="9"] .mult-label{font-size:6.5px;}
.ticket-grid[data-size="6"] .mult-label{font-size:10.5px;}
.ticket-grid[data-size="3"] .mult-label{font-size:16px;}

@keyframes matchPulse{
  0%,100%{box-shadow:0 0 0 2px var(--accent-green), 0 0 16px 3px rgba(0,231,1,.45);}
  50%{box-shadow:0 0 0 2px var(--accent-green), 0 0 26px 7px rgba(0,231,1,.8);}
}
.cell.match{animation:matchPulse 1s ease-in-out infinite; z-index:2;}

.grid-overlay{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  text-align:center;
  padding:20px;
  background:rgba(15,33,46,.78);
  backdrop-filter:blur(2px);
  border-radius:8px;
  color:var(--text-dim);
  font-weight:600;
  font-size:13.5px;
}

.status{
  margin:12px 2px 0;
  font-size:13.5px;
  font-weight:600;
  color:var(--text-dim);
  min-height:18px;
  transition:color .15s ease;
}
.status.win{color:var(--accent-green);}
.status.loss{color:var(--text-dim);}
.status.err{color:#ff6b6b;}

/* ---------- bet panel ---------- */
.bet-head{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-bottom:9px;
}
.bet-head span:first-child{
  font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--text-dim);
}
.bet-head span:last-child{
  font-family:var(--font-display);
  font-weight:700;
  font-variant-numeric:tabular-nums;
}
.bet-box{
  display:flex;align-items:stretch;
  background:var(--panel-2);
  border:1px solid var(--border);
  border-radius:9px;
  overflow:hidden;
}
.bet-input-wrap{
  flex:1;display:flex;align-items:center;gap:6px;padding:0 13px;min-width:0;
}
.bet-input-wrap .cur{color:var(--text-dim);font-weight:700;}
.bet-input-wrap input{
  flex:1;min-width:0;
  background:transparent;border:none;outline:none;
  color:var(--text);
  font-family:var(--font-display);
  font-weight:600;
  font-size:16px;
  font-variant-numeric:tabular-nums;
}
.bet-input-wrap input::-webkit-outer-spin-button,
.bet-input-wrap input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.chip-btn{
  flex:0 0 auto;
  background:transparent;
  border:none;
  border-left:1px solid var(--border);
  color:var(--text-dim);
  font-family:var(--font-body);
  font-weight:700;
  font-size:13px;
  padding:0 16px;
  cursor:pointer;
}
.chip-btn:hover{color:var(--text);}

.action-row{
  display:flex;gap:10px;margin-top:12px;
}
.btn-primary, .btn-secondary{
  font-family:var(--font-body);
  font-weight:700;
  font-size:15px;
  border-radius:9px;
  padding:14px 0;
  cursor:pointer;
  border:none;
  transition:background .15s ease, opacity .15s ease, border-color .15s ease;
}
.btn-primary{
  flex:1.3;
  background:var(--accent-blue);
  color:#fff;
}
.btn-primary:hover:not(:disabled){background:var(--accent-blue-hi);}
.btn-secondary{
  flex:1;
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
}
.btn-secondary:hover:not(:disabled){border-color:var(--text-dim);}
.btn-primary:disabled, .btn-secondary:disabled{opacity:.4;cursor:not-allowed;}

@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-5px);}
  75%{transform:translateX(5px);}
}
.shake{animation:shake .25s ease;}

@media (prefers-reduced-motion: reduce){
  .face, .face.back, .cell.match, .shake, .cover-tap{transition:none !important; animation:none !important;}
}

/* ---------- cover / splash ---------- */
.cover{
  position:fixed;inset:0;
  z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:#1a0d33;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
  cursor:pointer;
}
.cover img{
  width:100%;
  max-width:400px;
  border-radius:22px;
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  display:block;
}
.cover-tap{
  position:absolute;
  bottom:max(34px, calc(env(safe-area-inset-bottom,0px) + 22px));
  left:0;right:0;
  text-align:center;
  font-family:var(--font-display);
  font-weight:700;
  font-size:13.5px;
  letter-spacing:.8px;
  text-transform:uppercase;
  color:#fff;
  animation:tapPulse 1.6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes tapPulse{0%,100%{opacity:.5;}50%{opacity:1;}}

/* ---------- win modal ---------- */
.win-modal{
  position:fixed;inset:0;
  z-index:60;
  display:flex;align-items:center;justify-content:center;
  background:rgba(8,14,20,.75);
  backdrop-filter:blur(3px);
  padding:max(16px, env(safe-area-inset-left,0px));
  cursor:pointer;
}
.win-card{
  background:var(--panel);
  border:3px solid var(--accent-green);
  border-radius:20px;
  padding:30px 38px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:12px;
  max-width:300px;
  box-shadow:0 0 0 1px rgba(0,231,1,.25), 0 0 46px 10px rgba(0,231,1,.4);
  animation:winPop .4s cubic-bezier(.2,.9,.3,1.3);
}
.win-icon{width:60px;height:60px;}
.win-icon svg{width:100%;height:100%;}
.win-mult{
  font-family:var(--font-display);
  font-weight:700;
  font-size:38px;
  color:var(--accent-green);
  font-variant-numeric:tabular-nums;
}
.win-divider{width:100%;height:1px;background:var(--border);}
.win-amount{
  display:flex;align-items:center;gap:8px;
  font-family:var(--font-display);
  font-weight:700;
  font-size:19px;
  color:var(--accent-green);
  font-variant-numeric:tabular-nums;
}
@keyframes winPop{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}
</style>

    <div class="win-amount"><span class="balance-coin"></span><span id="winAmountText"></span></div>
  </div>
</div>

<div class="app">
  <div class="topbar">
    <div class="brand"><span class="brand-dot"></span>SCRATCH</div>
    <div class="balance-pill"><span class="balance-coin"></span><span id="balanceVal">$1,000.00</span></div>
  </div>

  <section class="panel">
    <p class="panel-title">Ticket</p>
    <div class="diff-tabs" id="diffTabs">
      <button class="diff-tab active" data-diff="easy" type="button">Easy 9×9</button>
      <button class="diff-tab" data-diff="medium" type="button">Medium 6×6</button>
      <button class="diff-tab" data-diff="hard" type="button">Hard 3×3</button>
    </div>

    <p class="legend-label">Prize Table — match 3 of a kind</p>
    <div class="legend" id="legend"></div>

    <div class="ticket-frame"><div class="ticket-frame-inner"><div class="grid-wrap">
      <div class="ticket-grid" id="grid" data-size="9"></div>
      <div class="grid-overlay" id="gridOverlay"><p>Place a bet to start a ticket.</p></div>
    </div></div></div>

    <p class="status" id="status">Match 3 identical gems anywhere on the ticket to win their multiplier.</p>
  </section>

  <section class="panel">
    <div class="bet-head"><span>Bet Amount</span><span id="betPreview">$1.00</span></div>
    <div class="bet-box">
      <div class="bet-input-wrap">
        <span class="cur">$</span>
        <input id="betInput" type="number" min="0.10" step="0.10" value="1.00" inputmode="decimal">
      </div>
      <button class="chip-btn" id="halfBtn" type="button">½</button>
      <button class="chip-btn" id="doubleBtn" type="button">2×</button>
    </div>
    <div class="action-row">
      <button class="btn-primary" id="betBtn" type="button">Bet</button>
      <button class="btn-secondary" id="revealAllBtn" type="button" disabled>Reveal All</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";

  var CONFIGS = {
    easy: { label:"Easy", size:9, symbols:[
      {id:"skull",   name:"Skull",   mult:0,  weight:95},
      {id:"blue",    name:"Blue",    mult:1,  weight:2.2},
      {id:"yellow",  name:"Yellow",  mult:2,  weight:1.3},
      {id:"green",   name:"Green",   mult:5,  weight:0.8},
      {id:"red",     name:"Red",     mult:10, weight:0.5},
      {id:"diamond", name:"Diamond", mult:25, weight:0.15},
      {id:"star",    name:"Star",    mult:50, weight:0.05}
    ]},
    medium: { label:"Medium", size:6, symbols:[
      {id:"skull",   name:"Skull",   mult:0,   weight:92},
      {id:"blue",    name:"Blue",    mult:2,   weight:3},
      {id:"yellow",  name:"Yellow",  mult:4,   weight:2},
      {id:"green",   name:"Green",   mult:10,  weight:1.3},
      {id:"red",     name:"Red",     mult:25,  weight:1},
      {id:"diamond", name:"Diamond", mult:60,  weight:0.5},
      {id:"star",    name:"Star",    mult:120, weight:0.2}
    ]},
    hard: { label:"Hard", size:3, symbols:[
      {id:"skull",   name:"Skull",   mult:0,   weight:70},
      {id:"blue",    name:"Blue",    mult:10,  weight:8},
      {id:"yellow",  name:"Yellow",  mult:20,  weight:7},
      {id:"green",   name:"Green",   mult:40,  weight:6},
      {id:"red",     name:"Red",     mult:80,  weight:5},
      {id:"diamond", name:"Diamond", mult:150, weight:3},
      {id:"star",    name:"Star",    mult:300, weight:1}
    ]}
  };

  var Sound = {
    ctx: null,
    ensure: function(){
      if(!this.ctx){
        var AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        this.ctx = new AC();
      }
      if(this.ctx.state === "suspended"){ this.ctx.resume(); }
      return this.ctx;
    },
    playScratch: function(){
      var ctx = this.ensure();
      if(!ctx) return;
      var dur = 0.4;
      var bufferSize = Math.floor(ctx.sampleRate * dur);
      var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for(var i=0;i<bufferSize;i++){ data[i] = Math.random()*2-1; }
      var src = ctx.createBufferSource();
      src.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.value = 0.8;
      filter.frequency.setValueAtTime(900, ctx.currentTime);
      filter.frequency.linearRampToValueAtTime(2200, ctx.currentTime + dur);
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.04);
      gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + dur);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start();
      src.stop(ctx.currentTime + dur);
    },
    playWin: function(mult){
      var ctx = this.ensure();
      if(!ctx) return;
      var notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
      var count = mult >= 100 ? 5 : mult >= 20 ? 4 : 3;
      var t = ctx.currentTime;
      for(var i=0;i<count;i++){
        var osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.value = notes[i];
        var gain = ctx.createGain();
        var start = t + i*0.1;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(0.35, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.32);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.34);
      }
    }
  };

  var state = {
    balance: 1000,
    bet: 1,
    difficulty: "easy",
    grid: [],
    revealed: [],
    counts: {},
    scratching: {},
    active: false,
    resolved: false
  };

  var el = {
    balanceVal: document.getElementById("balanceVal"),
    diffTabs: document.getElementById("diffTabs"),
    legend: document.getElementById("legend"),
    grid: document.getElementById("grid"),
    gridOverlay: document.getElementById("gridOverlay"),
    status: document.getElementById("status"),
    betInput: document.getElementById("betInput"),
    betPreview: document.getElementById("betPreview"),
    halfBtn: document.getElementById("halfBtn"),
    doubleBtn: document.getElementById("doubleBtn"),
    betBtn: document.getElementById("betBtn"),
    revealAllBtn: document.getElementById("revealAllBtn"),
    winModal: document.getElementById("winModal"),
    winIcon: document.getElementById("winIcon"),
    winMultText: document.getElementById("winMultText"),
    winAmountText: document.getElementById("winAmountText")
  };

  var winModalTimer = null;

  var cellEls = [];

  function formatMoney(n){
    return "$" + n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function formatMult(n){
    return Number.isInteger(n) ? String(n) : n.toFixed(1);
  }

  function gemSVG(sym){
    if(sym.id === "star"){
      return '<svg class="gem tier-star" viewBox="0 0 100 100" aria-hidden="true">' +
        '<path d="M50 4 L61 37 L96 37 L68 58 L79 92 L50 71 L21 92 L32 58 L4 37 L39 37 Z" ' +
          'fill="url(#grad-star)" stroke="rgba(255,255,255,.4)" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<path d="M44 30 L50 15 L56 30 L50 25 Z" fill="rgba(255,255,255,.65)"/>' +
        '</svg>';
    }
    if(sym.id === "diamond"){
      return '<svg class="gem tier-diamond" viewBox="0 0 100 100" aria-hidden="true">' +
        '<path d="M34 8 L66 8 L50 38 Z" fill="#cdf3ff"/>' +
        '<path d="M8 38 L34 8 L50 38 Z" fill="#1172c2"/>' +
        '<path d="M92 38 L66 8 L50 38 Z" fill="#7fe0ff"/>' +
        '<path d="M8 38 L50 38 L50 94 Z" fill="#1c92e0"/>' +
        '<path d="M92 38 L50 38 L50 94 Z" fill="#4fc3f2"/>' +
        '<path d="M8 38 L34 8 L66 8 L92 38 L50 94 Z" fill="none" ' +
          'stroke="rgba(255,255,255,.4)" stroke-width="2.5" stroke-linejoin="round"/>' +
        '<path d="M8 38 L92 38" stroke="rgba(255,255,255,.3)" stroke-width="1.3"/>' +
        '</svg>';
    }
    if(sym.id === "skull"){
      return '<svg class="gem tier-skull" viewBox="0 0 100 100" aria-hidden="true">' +
        '<path d="M50 4 C25 4 9 24 9 47 C9 61 18 70 27 74 L27 88 C27 92 30 94 34 94 L66 94 C70 94 73 92 73 88 L73 74 C82 70 91 61 91 47 C91 24 75 4 50 4 Z" ' +
          'fill="url(#grad-skull)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>' +
        '<circle cx="35" cy="46" r="11" fill="#f3f6f7"/>' +
        '<circle cx="65" cy="46" r="11" fill="#f3f6f7"/>' +
        '<path d="M50 56 L44 68 L56 68 Z" fill="#f3f6f7"/>' +
        '<rect x="31" y="78" width="38" height="13" rx="3" fill="#f3f6f7"/>' +
        '<rect x="39" y="78" width="3" height="13" fill="#1b2024"/>' +
        '<rect x="48.5" y="78" width="3" height="13" fill="#1b2024"/>' +
        '<rect x="58" y="78" width="3" height="13" fill="#1b2024"/>' +
        '</svg>';
    }
    return '<svg class="gem tier-'+sym.id+'" viewBox="0 0 100 100" aria-hidden="true">' +
      '<rect x="13" y="13" width="74" height="74" rx="18" fill="url(#grad-'+sym.id+')" ' +
        'stroke="rgba(255,255,255,.35)" stroke-width="2.5"/>' +
      '<path d="M22 34 L46 10 L30 10 L14 26 Z" fill="rgba(255,255,255,.25)"/>' +
      '</svg>';
  }

  function paintCover(ctx){
    var w = 140, h = 140;
    ctx.clearRect(0,0,w,h);
    var g = ctx.createLinearGradient(0,0,w,h);
    g.addColorStop(0,"#2c4457");
    g.addColorStop(1,"#1b2b36");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = "rgba(255,255,255,0.07)";
    ctx.lineWidth = 7;
    for(var x=-h; x<w+h; x+=15){
      ctx.beginPath();
      ctx.moveTo(x,0);
      ctx.lineTo(x+h,h);
      ctx.stroke();
    }
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.arc(w/2,h/2,17,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(w/2,h/2,17,0,Math.PI*2);
    ctx.stroke();
  }

  function clearCanvasInstant(canvas){
    var ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  function animateScratch(canvas, onDone){
    var ctx = canvas.getContext("2d");
    var w = canvas.width, h = canvas.height;
    var pad = w*0.12;
    var rows = 4;
    var pts = [];
    for(var r=0;r<rows;r++){
      var y = pad + (h-pad*2) * (r/(rows-1));
      if(r % 2 === 0){ pts.push([pad,y]); pts.push([w-pad,y]); }
      else { pts.push([w-pad,y]); pts.push([pad,y]); }
    }
    var segLens = [], total = 0, i;
    for(i=1;i<pts.length;i++){
      var dx = pts[i][0]-pts[i-1][0], dy = pts[i][1]-pts[i-1][1];
      var len = Math.sqrt(dx*dx+dy*dy);
      segLens.push(len);
      total += len;
    }
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = w*0.4;
    var duration = 420, start = null;
    function frame(ts){
      if(start === null) start = ts;
      var t = Math.min(1, (ts - start) / duration);
      var dist = t * total;
      var acc = 0, segIdx = 0;
      while(segIdx < segLens.length && acc + segLens[segIdx] < dist){
        acc += segLens[segIdx];
        segIdx++;
      }
      ctx.globalCompositeOperation = "destination-out";
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for(var s=0; s<segIdx; s++){
        ctx.lineTo(pts[s+1][0], pts[s+1][1]);
      }
      if(segIdx < segLens.length){
        var remain = dist - acc;
        var frac = segLens[segIdx] ? remain / segLens[segIdx] : 0;
        var p0 = pts[segIdx], p1 = pts[segIdx+1];
        ctx.lineTo(p0[0] + (p1[0]-p0[0])*frac, p0[1] + (p1[1]-p0[1])*frac);
      }
      ctx.stroke();
      if(t < 1){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0,0,w,h);
        ctx.globalCompositeOperation = "source-over";
        if(onDone) onDone();
      }
    }
    requestAnimationFrame(frame);
  }

  function pickSymbol(pool){
    var total = 0, i;
    for(i=0;i<pool.length;i++) total += pool[i].weight;
    var r = Math.random() * total;
    for(i=0;i<pool.length;i++){
      if(r < pool[i].weight) return pool[i];
      r -= pool[i].weight;
    }
    return pool[pool.length-1];
  }

  function buildWeightedGrid(cfg){
    var n = cfg.size * cfg.size, out = [];
    for(var i=0;i<n;i++) out.push(pickSymbol(cfg.symbols));
    return out;
  }

  function renderBalance(){
    el.balanceVal.textContent = formatMoney(state.balance);
  }

  function updateBetPreview(){
    var v = parseFloat(el.betInput.value);
    el.betPreview.textContent = formatMoney(isNaN(v) ? 0 : v);
  }

  function renderLegend(cfg){
    var paid = cfg.symbols.filter(function(s){ return s.mult > 0; })
      .sort(function(a,b){ return b.mult - a.mult; });
    el.legend.innerHTML = paid.map(function(s){
      return '<div class="legend-item">' + gemSVG(s) +
        '<span class="legend-mult">×'+formatMult(s.mult)+'</span></div>';
    }).join("");
  }

  function setStatus(text, cls){
    el.status.textContent = text;
    el.status.className = "status" + (cls ? " "+cls : "");
  }

  function updateDiffTabsUI(){
    var btns = el.diffTabs.querySelectorAll(".diff-tab");
    btns.forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-diff") === state.difficulty);
    });
    el.diffTabs.classList.toggle("locked", state.active);
  }

  function updateControlsEnabled(){
    el.betBtn.disabled = state.active;
    el.revealAllBtn.disabled = !state.active;
  }

  function buildGridDOM(cfg){
    el.grid.dataset.size = cfg.size;
    el.grid.style.setProperty("--cols", cfg.size);
    el.grid.classList.remove("interactive");
    el.grid.innerHTML = "";
    cellEls = [];
    var n = cfg.size * cfg.size;
    for(var i=0;i<n;i++){
      var cell = document.createElement("button");
      cell.type = "button";
      cell.className = "cell";
      cell.setAttribute("aria-label", "Scratch panel");
      cell.innerHTML = '<span class="face front"></span><canvas class="scratch-canvas" width="140" height="140"></canvas>';
      (function(idx){
        cell.addEventListener("click", function(){ userScratch(idx); });
      })(i);
      el.grid.appendChild(cell);
      cellEls.push(cell);
      paintCover(cell.querySelector("canvas").getContext("2d"));
    }
  }

  function paintCellFront(i){
    var sym = state.grid[i];
    var front = cellEls[i].querySelector(".face.front");
    var label = sym.mult > 0
      ? '<span class="mult-label" style="color:#fff">×'+formatMult(sym.mult)+'</span>'
      : '<span class="mult-label" style="color:var(--text-dim)">—</span>';
    front.innerHTML = gemSVG(sym) + label;
  }

  function doRevealLogic(i){
    if(state.resolved) return;
    var sym = state.grid[i];
    if(sym.mult > 0){
      state.counts[sym.id] = (state.counts[sym.id] || 0) + 1;
      if(state.counts[sym.id] >= 3){
        resolve(sym);
        return;
      }
    }
    if(state.revealed.every(Boolean)){
      resolve(null);
    }
  }

  function userScratch(i){
    if(!state.active || state.resolved || state.revealed[i] || state.scratching[i]) return;
    state.scratching[i] = true;
    state.revealed[i] = true;
    cellEls[i].classList.add("revealed");
    Sound.playScratch();
    animateScratch(cellEls[i].querySelector("canvas"), function(){
      state.scratching[i] = false;
      doRevealLogic(i);
    });
  }

  function instantScratch(i){
    if(!state.active || state.resolved || state.revealed[i]) return;
    state.revealed[i] = true;
    cellEls[i].classList.add("revealed");
    clearCanvasInstant(cellEls[i].querySelector("canvas"));
    doRevealLogic(i);
  }

  function resolve(winSymbol){
    state.active = false;
    state.resolved = true;

    if(winSymbol){
      var payout = +(state.bet * winSymbol.mult).toFixed(2);
      state.balance = +(state.balance + payout).toFixed(2);
      setStatus(winSymbol.name + " ×3 matched — won " + formatMoney(payout) + " ("+formatMult(winSymbol.mult)+"×)", "win");
      state.grid.forEach(function(sym, idx){
        if(sym.id === winSymbol.id && state.revealed[idx]){
          cellEls[idx].classList.add("match");
        }
      });
      showWinModal(winSymbol, payout);
    } else {
      setStatus("No match this ticket. Scratch another!", "loss");
    }

    state.grid.forEach(function(sym, idx){
      if(!state.revealed[idx]){
        state.revealed[idx] = true;
        paintCellFront(idx);
        clearCanvasInstant(cellEls[idx].querySelector("canvas"));
        cellEls[idx].classList.add("revealed", "final");
      }
    });

    el.grid.classList.remove("interactive");
    renderBalance();
    updateDiffTabsUI();
    updateControlsEnabled();
  }

  function showWinModal(sym, payout){
    el.winIcon.innerHTML = gemSVG(sym);
    el.winMultText.textContent = "×" + formatMult(sym.mult);
    el.winAmountText.textContent = formatMoney(payout);
    el.winModal.hidden = false;
    Sound.playWin(sym.mult);
    clearTimeout(winModalTimer);
    winModalTimer = setTimeout(hideWinModal, 2200);
  }

  function hideWinModal(){
    el.winModal.hidden = true;
  }

  function placeBet(){
    if(state.active) return;
    var betVal = parseFloat(el.betInput.value);
    if(!(betVal > 0)){
      setStatus("Enter a bet amount first.", "err");
      el.betInput.parentElement.parentElement.classList.add("shake");
      setTimeout(function(){ el.betInput.parentElement.parentElement.classList.remove("shake"); }, 260);
      return;
    }
    if(betVal > state.balance){
      setStatus("Insufficient balance.", "err");
      el.betInput.parentElement.parentElement.classList.add("shake");
      setTimeout(function(){ el.betInput.parentElement.parentElement.classList.remove("shake"); }, 260);
      return;
    }

    betVal = +betVal.toFixed(2);
    state.bet = betVal;
    state.balance = +(state.balance - betVal).toFixed(2);

    var cfg = CONFIGS[state.difficulty];
    state.grid = buildWeightedGrid(cfg);
    state.revealed = new Array(state.grid.length).fill(false);
    state.counts = {};
    state.scratching = {};
    state.active = true;
    state.resolved = false;

    buildGridDOM(cfg);
    for(var i=0;i<state.grid.length;i++) paintCellFront(i);
    el.grid.classList.add("interactive");
    el.gridOverlay.hidden = true;

    setStatus("Scratch panels — match 3 identical gems to win.");
    renderBalance();
    updateDiffTabsUI();
    updateControlsEnabled();
  }

  function revealAll(){
    if(!state.active) return;
    var idxs = [];
    state.revealed.forEach(function(r, i){ if(!r) idxs.push(i); });
    var p = 0;
    function step(){
      if(!state.active) return;
      if(p >= idxs.length) return;
      instantScratch(idxs[p]);
      p++;
      if(state.active) setTimeout(step, 16);
    }
    step();
  }

  function switchDifficulty(key){
    if(state.active){
      setStatus("Finish the current ticket first.", "err");
      return;
    }
    state.difficulty = key;
    var cfg = CONFIGS[key];
    updateDiffTabsUI();
    buildGridDOM(cfg);
    el.gridOverlay.hidden = false;
    renderLegend(cfg);
    setStatus("Match 3 identical gems anywhere on the ticket to win their multiplier.");
  }

  el.diffTabs.addEventListener("click", function(e){
    var btn = e.target.closest(".diff-tab");
    if(!btn) return;
    switchDifficulty(btn.getAttribute("data-diff"));
  });

  el.betInput.addEventListener("input", updateBetPreview);
  el.halfBtn.addEventListener("click", function(){
    if(state.active) return;
    var v = parseFloat(el.betInput.value) || 0;
    v = Math.max(0.10, +(v/2).toFixed(2));
    el.betInput.value = v.toFixed(2);
    updateBetPreview();
  });
  el.doubleBtn.addEventListener("click", function(){
    if(state.active) return;
    var v = parseFloat(el.betInput.value) || 0;
    v = Math.min(state.balance || v, +(v*2).toFixed(2));
    el.betInput.value = v.toFixed(2);
    updateBetPreview();
  });
  el.betBtn.addEventListener("click", placeBet);
  el.revealAllBtn.addEventListener("click", revealAll);

  var coverEl = document.getElementById("cover");
  coverEl.addEventListener("click", function(){ coverEl.hidden = true; Sound.ensure(); });
  el.winModal.addEventListener("click", hideWinModal);

  // init
  (function init(){
    renderBalance();
    updateBetPreview();
    var cfg = CONFIGS[state.difficulty];
    buildGridDOM(cfg);
    renderLegend(cfg);
    updateControlsEnabled();
  })();
})();
</script>

</body></html>
